name: client-engagement-check
on:
  push:
    paths:
      - 'scripts/client_engagement.py'
      - 'scripts/test_client_engagement.py'
      - 'scripts/client_deployment_check.py'
      - 'scripts/test_client_deployment_check.py'
      - '.github/workflows/client-engagement-check.yml'
  pull_request:
    paths:
      - 'scripts/client_engagement.py'
      - 'scripts/test_client_engagement.py'
      - 'scripts/client_deployment_check.py'
      - 'scripts/test_client_deployment_check.py'
      - '.github/workflows/client-engagement-check.yml'
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_client_engagement.py -v
      - run: python3 scripts/test_client_deployment_check.py -v
      - run: python3 -m py_compile scripts/client_engagement.py scripts/client_deployment_check.py
